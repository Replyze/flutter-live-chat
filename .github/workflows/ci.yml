name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format --set-exit-if-changed
        id: format
        run: dart format --set-exit-if-changed .
      - name: The changes dart format wants, as a patch
        if: failure() && steps.format.outcome == 'failure'
        run: git diff | tee "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v7
        if: failure() && steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch

  test:
    name: Analyze and test (Flutter stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  oldest:
    # The oldest Flutter the pubspec allows (flutter: ">=3.19.0"), with the
    # newest dependency versions that still support it. Without the example,
    # which needs Flutter 3.47 (material_ui).
    name: Analyze and test (Flutter 3.19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
          cache: true
      # Flutter 3.19 reads example/ even with --no-example, so it goes.
      - name: Remove the example (it needs Flutter 3.47)
        run: rm -rf example
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  package:
    name: Package (publish dry run, pana)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Same as the release workflow. pub.dev shows the README from the package: its links say utm_source=pubdev.
      # Only this checkout's copy changes, never the file in the repository.
      # (assume-unchanged: pub warns about modified checked-in files.)
      - name: README for pub.dev (utm_source=pubdev)
        run: |
          sed -i 's/utm_source=github/utm_source=pubdev/g' README.md
          git update-index --assume-unchanged README.md
          if grep -q 'utm_source=github' README.md; then
            echo "::error::README.md still has utm_source=github."
            exit 1
          fi
      - run: dart pub publish --dry-run
      - name: Links in the README that goes into the package
        run: grep -o 'utm_source=[a-z]*&utm_medium=[a-z]*&utm_campaign=[a-z-]*' README.md | sort | uniq -c
      # The release workflow takes its notes from CHANGELOG.md: the current version needs a section.
      - name: CHANGELOG.md has a section for the version in pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          dart tool/changelog_notes.dart "$version"
      - name: pana (the pub.dev score)
        run: |
          dart pub global activate pana
          export PATH="$PATH:$HOME/.pub-cache/bin"
          pana --no-warning --exit-code-threshold 0 .

  git-install:
    # What the README tells developers to do, against this commit: a new
    # Flutter app, the package as a git dependency, the README Quickstart as
    # lib/main.dart, flutter analyze.
    name: Install from GitHub (a new app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: A new app with the git dependency
        run: |
          cd "$RUNNER_TEMP"
          flutter create --empty --platforms=android,ios quickstart_app
          cd quickstart_app
          flutter pub add "replyze_flutter:{\"git\":{\"url\":\"https://github.com/$REPO.git\",\"ref\":\"$SHA\"}}"
          cp "$GITHUB_WORKSPACE/example/lib/quickstart.dart" lib/main.dart
          rm -rf test
          flutter analyze

  example-android:
    name: Example app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the platform folders
        working-directory: example
        run: flutter create --platforms=android,ios --project-name replyze_flutter_example .
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  example-ios:
    name: Example app (iOS, no code signing)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the platform folders
        working-directory: example
        run: flutter create --platforms=ios --project-name replyze_flutter_example .
      - run: flutter build ios --debug --no-codesign
        working-directory: example
