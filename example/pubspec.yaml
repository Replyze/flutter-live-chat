name: replyze_flutter_example
description: A small app with the Replyze chat.
publish_to: none
version: 1.0.0

# Flutter 3.47 moved Material into the material_ui package, which new apps
# use. The replyze_flutter package itself needs only Flutter 3.19.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  replyze_flutter:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
