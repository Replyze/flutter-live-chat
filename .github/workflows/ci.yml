name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format --set-exit-if-changed
        id: format
        run: dart format --set-exit-if-changed .
      - name: The changes dart format wants, as a patch
        if: failure() && steps.format.outcome == 'failure'
        run: git diff | tee "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch

  test:
    name: Analyze and test (Flutter stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  oldest:
    # The oldest Flutter the pubspec allows (flutter: ">=3.19.0"), with the
    # newest dependency versions that still support it.
    name: Analyze and test (Flutter 3.19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  package:
    name: Package (publish dry run, pana)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
      # The release workflow takes its notes from CHANGELOG.md: the current version needs a section.
      - name: CHANGELOG.md has a section for the version in pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          dart tool/changelog_notes.dart "$version"
      - name: pana (the pub.dev score)
        run: |
          dart pub global activate pana
          export PATH="$PATH:$HOME/.pub-cache/bin"
          pana --no-warning --exit-code-threshold 0 .

  example-android:
    name: Example app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the platform folders
        working-directory: example
        run: flutter create --platforms=android,ios --project-name replyze_flutter_example .
      - run: flutter test
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  example-ios:
    name: Example app (iOS, no code signing)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the platform folders
        working-directory: example
        run: flutter create --platforms=ios --project-name replyze_flutter_example .
      - run: flutter build ios --debug --no-codesign
        working-directory: example
